<router-outlet></router-outlet>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>

<div class="row">
  @if(isNewUser == false){
    <div class="col-12">
      <div class="card">
        <div class="card-header bg-warning">
          <div class="row">
            <div class="col-6">
              <h6>User List</h6>
            </div>
            <div class="col-6 text-end">
              <button class="btn btn-success" (click)="changeView()">Add New User</button>
            </div>
          </div>
        </div>
        <div class="card-body">
          <div class="row">
            @for(item of userList; track $index){
            <div class="col-3">
              <div class="card" style="width: 18rem;">
                <div class="card-body">
                  <h5 class="card-title">{{item.fName}} {{item.lName}}</h5>
                  <h6 class="card-subtitle mb-2 text-body-secondary">{{item.uName}}</h6>
                  <p class="card-text">{{item.city}} , {{item.state}} , {{item.zipcode}}</p>

                  <a style="cursor: pointer;" class="card-link text-success" (click)="onEdit(item)">Edit</a>
                  <a   style="cursor: pointer;" class="card-link text-danger" (click)="onDelete(item.userid)">Delete</a>
                </div>
              </div>
              
            </div>
            }
          </div>
         
        </div>
      </div>
    </div>
  }
  @else{
    <div class="col-12">
      <div class="card mt-3">
        <div class="card-header bg-warning">
          <div class="row">
            <div class="col-6">
              <h6>New User</h6>
            </div>
            <div class="col-6 text-end">
              <button class="btn btn-success" (click)="changeView()">List View</button>
            </div>
          </div>
        </div>
        <div class="card-body">
          <form class="row g-3">
            <div class="col-md-4">
              <label for="validationDefault01" class="form-label">First name</label>
              <input type="text"  [(ngModel)]="userObj.fName" name="fName" class="form-control" id="validationDefault01" value="Mark" required />
            </div>
            <div class="col-md-4">
              <label for="validationDefault02" class="form-label">Last name</label>
              <input type="text"   [(ngModel)]="userObj.lName" name="lName" class="form-control"id="validationDefault02" value="Otto" required/>
            </div>
            <div class="col-md-4">
              <label for="validationDefaultUsername" class="form-label">Username</label>
              <div class="input-group">
                <span class="input-group-text" id="inputGroupPrepend2">&#64;</span>
                <input type="text"   [(ngModel)]="userObj.uName" name="uName" class="form-control" id="validationDefaultUsername" aria-describedby="inputGroupPrepend2" required/>
              </div>
            </div>
            <div class="col-md-6">
              <label for="validationDefault03" class="form-label">City</label>
              <input type="text"   [(ngModel)]="userObj.city" name="city" class="form-control" id="validationDefault03" required/>
            </div>
            <div class="col-md-3">
              <label for="validationDefault04" class="form-label">State</label>
              <select class="form-select"  [(ngModel)]="userObj.state" name="state" id="validationDefault04" required >
                <option selected disabled value="">Choose States</option>
                <option>Maharashtra</option>
                <option>Goa</option>
                <option>PUnjab</option>
              </select>
            </div>
            <div class="col-md-3">
              <label for="validationDefault05" class="form-label">Zip</label>
              <input type="text" [(ngModel)]="userObj.zipcode" name="zipcode" class="form-control" id="validationDefault05" required/>
            </div>
            <div class="col-12">
              <div class="form-check">
                <input class="form-check-input"  [(ngModel)]="userObj.isagree" name="isagree" type="checkbox" value="" id="invalidCheck2" required/>
                <label class="form-check-label" for="invalidCheck2">
                  Agree to terms and conditions
                </label>
              </div>
            </div>
            <div class="col-12">
              @if(userObj.userid == 0){
                <button class="btn btn-primary" type="submit" (click)="onSave()">Save User </button>
              }
              @else{
                <button class="btn btn-warning" type="submit" (click)="onUpdate()"> Upadte</button>
              }
            </div>
          </form>
        </div>
      </div>
    </div>
  }
  
</div>
